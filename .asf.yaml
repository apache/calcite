github:
  description: "Apache Calcite"
  homepage: https://calcite.apache.org/
  features:
    wiki: false
    issues: false
    projects: false
  enabled_merge_buttons:
    # "squash and merge" replaces committer with noreply@github, and we don't want that
    # See https://lists.apache.org/thread/vxxpt1x316kjryb4dptsbs95p66d9xrv
    squash:  false
    # We prefer linear history, so creating merge commits is disabled in UI
    merge:   false
    rebase:  true
  rulesets:
    - name: PR checks
      target: branch
      enforcement: active
      bypass_actors: []
      conditions:
        ref_name:
          include: [refs/heads/main]
          exclude: []
      rules:
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: false
            # Keep contexts in sync with the check names reported on PRs.
            # Jenkins pr-head is deliberately not required.
            required_status_checks:
              - context: Check PR title
                integration_id: 15368 # GitHub Actions
              - context: Check single commit
                integration_id: 15368 # GitHub Actions
              - context: Validation
                integration_id: 15368 # GitHub Actions
              - context: Windows (JDK 8)
                integration_id: 15368 # GitHub Actions
              - context: Windows (JDK 17)
                integration_id: 15368 # GitHub Actions
              - context: Windows (JDK 21)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 8, oldest Guava, America/New_York Timezone)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 8, latest Guava, America/New_York Timezone)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 11, Pacific/Chatham Timezone)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 17)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 21)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 24)
                integration_id: 15368 # GitHub Actions
              - context: Linux (JDK 11, Avatica main)
                integration_id: 15368 # GitHub Actions
              - context: macOS (JDK 21)
                integration_id: 15368 # GitHub Actions
              - context: ErrorProne (JDK 11, latest Guava)
                integration_id: 15368 # GitHub Actions
              - context: CheckerFramework (JDK 11)
                integration_id: 15368 # GitHub Actions
              - context: CheckerFramework (JDK 11, oldest Guava)
                integration_id: 15368 # GitHub Actions
              - context: Druid Tests
                integration_id: 15368 # GitHub Actions
              - context: SonarCloud
                integration_id: 57789 # GitHub Code Scanning
              - context: SonarCloud Code Analysis
                integration_id: 12526 # SonarQube Cloud
notifications:
    commits:      commits@calcite.apache.org
    issues:       issues@calcite.apache.org
    pullrequests: commits@calcite.apache.org
    jira_options: link label
