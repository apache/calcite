services:
  dev:
    image: jekyll/jekyll:4
    command: sh -c "wget -O /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/bin/yq && ./download-avatars.sh && jekyll serve --host 0.0.0.0 --watch --force_polling"
    ports:
      - 4000:4000
    volumes:
      - .:/srv/jekyll
  build-site:
    image: jekyll/jekyll:4
    command: sh -c "wget -O /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/bin/yq && ./download-avatars.sh && jekyll build && chmod 777 ./*"
    volumes:
      - .:/srv/jekyll
  generate-javadoc:
    image: eclipse-temurin:19
    working_dir: /usr/src/calcite
    command: sh -c "./gradlew javadocAggregate; rm -rf site/target/javadocAggregate; mkdir -p site/target; mv build/docs/javadocAggregate site/target"
    volumes:
      - ../:/usr/src/calcite
      - maven-repo:/root/.m2
volumes:
  maven-repo:

# End docker-compose.yml
