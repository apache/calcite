name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Check PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use the PR workflow so contributors can exercise this check before it is merged.
      # Read metadata only; do not check out or execute PR code.
      - name: Compare PR title, Jira summary, and commit subjects
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const guide = 'https://calcite.apache.org/develop/#contributing';
            const fail = message => core.setFailed(`${message} See ${guide}.`);
            try {
              const pullRequest = {
                ...context.repo,
                pull_number: context.issue.number,
              };
              const { data: pr } = await github.rest.pulls.get(pullRequest);
              if (pr.state !== 'open') {
                core.info('PR is closed; nothing to check.');
                return;
              }
              if (pr.head.sha !== context.payload.pull_request.head.sha) {
                fail('PR commits changed. Use the check on the latest PR head.');
                return;
              }
              const match = /^\[(CALCITE-[0-9]+)\]/.exec(pr.title);
              if (!match) {
                core.info('Title consistency check skipped: no [CALCITE-<digits>] prefix.');
                return;
              }

              const key = match[1];
              let summary;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  // Jira is public; never send the GitHub token to it.
                  const response = await fetch(
                    `https://issues.apache.org/jira/rest/api/2/issue/${key}?fields=summary`,
                    {
                      headers: { Accept: 'application/json' },
                      signal: AbortSignal.timeout(15000),
                    }
                  );
                  if (response.status === 404) {
                    fail(`Jira issue ${key} does not exist or is not public.`);
                    return;
                  }
                  if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                  }
                  const issue = await response.json();
                  summary = issue.fields?.summary;
                  if (typeof summary !== 'string' || !summary.trim()) {
                    throw new Error('Jira returned an empty summary');
                  }
                  break;
                } catch (error) {
                  if (attempt === 3) {
                    fail(`Cannot read Jira issue ${key}: ${error.message}. Rerun this check.`);
                    return;
                  }
                  core.warning(`Jira request failed; retrying (${attempt}/3).`);
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }

              const expected = `[${key}] ${summary}`;
              if (pr.title !== expected) {
                fail(`PR title differs from Jira. Expected ${JSON.stringify(expected)}; ` +
                  `found ${JSON.stringify(pr.title)}.`);
                return;
              }

              // GraphQL pagination also covers PRs beyond the REST API's 250-commit limit.
              let cursor = null;
              let matchingCommit = false;
              do {
                const { repository } = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        headRefOid
                        commits(first: 100, after: $cursor) {
                          nodes { commit { message } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`, { ...context.repo, number: pr.number, cursor });
                const current = repository.pullRequest;
                if (current.headRefOid !== pr.head.sha) {
                  fail('PR commits changed during validation. Use the latest PR check.');
                  return;
                }
                matchingCommit = current.commits.nodes.some(
                  ({ commit }) => commit.message.split(/\r?\n/, 1)[0] === pr.title
                );
                cursor = current.commits.pageInfo.hasNextPage
                  ? current.commits.pageInfo.endCursor : null;
              } while (!matchingCommit && cursor);

              const { data: latest } = await github.rest.pulls.get(pullRequest);
              if (latest.head.sha !== pr.head.sha || latest.title !== pr.title ||
                  latest.base.sha !== pr.base.sha) {
                fail('PR title, base, or commits changed during validation. Rerun this check.');
                return;
              }
              if (!matchingCommit) {
                fail(`No commit message has the required first line ${JSON.stringify(pr.title)}. ` +
                  'Update at least one commit subject; the message body may differ.');
                return;
              }
              core.info('PR title, Jira summary, and at least one commit subject match exactly.');
            } catch (error) {
              fail(`Cannot validate title consistency: ${error.message}. Rerun this check.`);
            }
