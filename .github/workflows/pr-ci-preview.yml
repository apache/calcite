name: PR CI Preview

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  preview:
    name: Preview PR merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-ci-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # This read-only job exercises the PR's actual checks before installation on main.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const gate = require('./.github/scripts/pr-ci.cjs');
            await gate.preview({ github, context, core });
