name: PR CI

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: ['**', '!PR CI']
    types: [requested, in_progress, completed]
  check_run:
    types: [created, rerequested, completed]
  status:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'PR number to refresh (leave empty to refresh all open PRs)'
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  find-pulls:
    name: Find PRs for merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pulls: ${{ steps.find.outputs.pulls }}
    steps:
      # Always load trusted code, including for manual dispatches to another ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: find
        with:
          retries: 3
          script: |
            const gate = require('./.github/scripts/pr-ci.cjs');
            const pulls = await gate.findPullRequests({ github, context });
            core.setOutput('pulls', JSON.stringify(pulls));

  update:
    name: Update PR merge gate
    needs: find-pulls
    if: needs.find-pulls.outputs.pulls != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find-pulls.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      # Serialize updates for each PR; a queued update always reads the current state.
      group: pr-merge-gate-${{ github.repository }}-${{ matrix.pull }}
      cancel-in-progress: false
    steps:
      # Never execute PR code, download artifacts, or restore caches with this token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ matrix.pull }}
        with:
          retries: 3
          script: |
            const gate = require('./.github/scripts/pr-ci.cjs');
            await gate.publish({ github, context, core, number: Number(process.env.PR_NUMBER) });
