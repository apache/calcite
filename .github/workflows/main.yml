# The default workflow for GitHub Actions that is used for continuous
# integration. A configuration file that is used to control when, where,
# and how different CI jobs are executed.
# For more information on how to modify this file check the following link:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions

name: CI

on:
  push:
    paths-ignore:
      - 'site/**'
    # Pull requests get CI from the pull_request event. Without this filter,
    # a pull request from a branch in this repository runs CI twice per commit.
    branches:
      - main
      - 'branch-*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'site/**'
    branches:
      - '*'
  # Replays the test jobs of an earlier run: paste the seed from its log
  workflow_dispatch:
    inputs:
      matrix_rng_seed:
        description: 'RNG seed of the test matrix'
        required: false

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

# Throw OutOfMemoryError in case less than 35% is free after full GC
# This avoids never-ending GC trashing if memory gets too low in case of a memory leak
env:
  _JAVA_OPTIONS: '-XX:GCTimeLimit=90 -XX:GCHeapFreeLimit=35'
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  # matrix.mjs reads both values as well
  GUAVA_MIN: '21.0' # oldest supported Guava version
  GUAVA_MAX: '33.4.8-jre' # latest supported Guava version

jobs:
  matrix_prep:
    name: 'Matrix preparation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      MATRIX_JOBS: 6
      # Every push to a pull request gets the same rows
      GITHUB_PR_NUMBER: ${{ github.event.number }}
      RNG_SEED: ${{ github.event.inputs.matrix_rng_seed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: set-matrix
        run: |
          npm ci --prefix .github/workflows
          node .github/workflows/matrix.mjs

  test:
    name: '${{ matrix.name }}'
    needs: matrix_prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    env:
      TZ: ${{ matrix.tz }}
      ORG_GRADLE_PROJECT_testExtraJvmArgs: ${{ matrix.testExtraJvmArgs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: 'Set up JDK 25 for compilation'
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'
          # https://github.com/actions/setup-java/issues/559
          architecture: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
      # The last JDK set up becomes JAVA_HOME, which runs Gradle and the tests
      - name: 'Set up JDK ${{ matrix.java_version }} (${{ matrix.java_distribution }}) for tests'
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java_version }}
          distribution: ${{ matrix.java_distribution }}
          # https://github.com/actions/setup-java/issues/559
          architecture: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
      - name: 'Clone Avatica main'
        if: ${{ matrix.avatica == 'main' }}
        run: git clone --branch main --depth 100 https://github.com/apache/calcite-avatica.git ../calcite-avatica
      - uses: burrunan/gradle-cache-action@v1
        name: 'Build Avatica main'
        if: ${{ matrix.avatica == 'main' }}
        with:
          job-id: avatica-jdk${{ matrix.java_version }}
          remote-build-cache-proxy-enabled: false
          build-root-directory: ../calcite-avatica
          arguments: publishToMavenLocal
          properties: |
            calcite.avatica.version=1.0.0-dev-main
            skipJavadoc=
      - name: 'Parameters: JDK ${{ matrix.java_version }} ${{ matrix.java_distribution }}, Guava ${{ matrix.guava }}, TZ=${{ matrix.tz }}, ${{ matrix.testExtraJvmArgs }}'
        shell: bash
        env:
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: |
          echo "Matrix row: $MATRIX_JSON"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Properties the test JVM sees with testExtraJvmArgs:"
          # testExtraJvmArgs is unquoted on purpose: each argument is a separate word
          "$JAVA_HOME/bin/java" $ORG_GRADLE_PROJECT_testExtraJvmArgs -XshowSettings:properties -version 2>&1 \
            | grep -E '^ *(java\.version|java\.vendor|java\.vm\.name|user\.language|user\.country|user\.timezone|file\.encoding|os\.name|os\.arch) ='
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.java_version }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ matrix.guava }} ${{ matrix.avatica == 'main' && '-Pcalcite.avatica.version=1.0.0-dev-main-SNAPSHOT -PenableMavenLocal' || '' }} tasks build ${{ matrix.javadoc && 'javadoc' || '' }}
          properties: |
            org.gradle.java.installations.auto-download=false
      - name: 'sqlline and sqlsh'
        if: ${{ runner.os == 'Windows' }}
        env:
          JAVA_OPTS: "-Dcalcite.model.classes.allowed=org.apache."
        shell: cmd
        run: |
          call sqlline.bat -e '!quit'
          echo.
          echo Sqlline example/csv
          call sqlline.bat --verbose -u jdbc:calcite:model=example/csv/src/test/resources/model.json -n admin -p admin -f example/csv/src/test/resources/smoke_test.sql
          echo.
          echo sqlsh
          call sqlsh.bat -o headers "select count(*) commits, author from (select substring(author, 1, position(' <' in author)-1) author from git_commits) group by author order by count(*) desc, author limit 20"
      - name: 'sqlline and sqlsh'
        if: ${{ runner.os != 'Windows' }}
        env:
          JAVA_OPTS: "-Dcalcite.model.classes.allowed=org.apache."
        run: |
          ./sqlline -e '!quit'
          echo
          echo Sqlline example/csv
          ./sqlline --verbose -u jdbc:calcite:model=example/csv/src/test/resources/model.json -n admin -p admin -f example/csv/src/test/resources/smoke_test.sql
          echo
          echo sqlsh
          ./sqlsh -o headers "select count(*) commits, author from (select substring(author, 1, position(' <' in author)-1) author from git_commits) group by author order by count(*) desc, author limit 20"

  errorprone-guava-latest:
    name: 'ErrorProne (JDK 11, latest Guava)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: errprone
          remote-build-cache-proxy-enabled: false
          # ErrorProne checks for Beta APIs, so use the latest supported Guava version
          arguments: --scan --no-parallel --no-daemon -PjdkBuildVersion=11 -Pguava.version=${{ env.GUAVA_MAX }} -PenableErrorprone classes
          properties: |
            org.gradle.java.installations.auto-download=false

  linux-checkerframework:
    name: 'CheckerFramework (JDK 11)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'zulu'
      - name: 'Run CheckerFramework'
        uses: burrunan/gradle-cache-action@v1
        with:
          job-id: checkerframework-jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -PjdkBuildVersion=11 -PenableCheckerframework :linq4j:classes :core:classes :server:classes
          properties: |
            org.gradle.java.installations.auto-download=false

  linux-checkerframework-oldest-guava:
    name: 'CheckerFramework (JDK 11, oldest Guava)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'zulu'
      - name: 'Run CheckerFramework'
        uses: burrunan/gradle-cache-action@v1
        with:
          job-id: checkerframework-jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -PjdkBuildVersion=11 -Pguava.version=${{ env.GUAVA_MIN }} -PenableCheckerframework :linq4j:classes :core:classes :server:classes
          properties: |
            org.gradle.java.installations.auto-download=false

  linux-druid:
    name: 'Druid Tests'
    runs-on: ubuntu-latest
    steps:
    - name: 'Set up JDK 25 for compilation and JDK 17 for tests'
      uses: actions/setup-java@v6
      with:
        java-version: |
          25
          17
        distribution: 'zulu'
    - name: 'Checkout Druid dataset'
      uses: actions/checkout@v7
      with:
        repository: zabetak/calcite-druid-dataset
        fetch-depth: 1
        path: druid-dataset
    - name: 'Start Druid containers'
      working-directory: ./druid-dataset
      run: |
        chmod -R 777 storage
        docker compose up -d
    - name: 'Wait Druid nodes to startup'
      run: |
        until docker logs coordinator | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs router | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs historical | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs middlemanager | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs broker | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
    - name: 'Index Foodmart/Wikipedia datasets'
      working-directory: ./druid-dataset
      run: ./index.sh 30s
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        path: calcite
    - uses: burrunan/gradle-cache-action@v1
      name: 'Run Druid tests'
      timeout-minutes: 10
      with:
        build-root-directory: ./calcite
        job-id: Druid8
        remote-build-cache-proxy-enabled: false
        arguments: --scan --no-parallel --no-daemon :druid:test -Dcalcite.test.druid=true
        properties: |
          org.gradle.java.installations.auto-download=false
